{% extends 'base.html' %}
{% block conteudo %}
  <a href="{% url 'criar' %}">+ Nova tarefa</a>
  <ul>
    {% for t in tarefas %}
      <li>
        <span class="{% if t.concluida %}feita{% endif %}">{{ t.titulo }}</span>
        <a href="{% url 'editar' t.pk %}">Editar</a>
        <a href="{% url 'excluir' t.pk %}">Excluir</a>
      </li>
    {% empty %}
      <li>Nenhuma tarefa ainda.</li>
    {% endfor %}
  </ul>
{% endblock %}
